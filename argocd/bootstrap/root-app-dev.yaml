apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-gitops-root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ajaydhungel7/k8s-gitops
    targetRevision: dev
    path: argocd/apps
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

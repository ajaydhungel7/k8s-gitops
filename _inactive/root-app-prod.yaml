apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-gitops-root-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/k8s-gitops
    targetRevision: prod
    path: argocd/apps
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
